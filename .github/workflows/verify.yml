name: Verify LeagueDesk
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Backend format, unit and integration tests
        run: mvn -B -f backend/pom.xml spotless:check verify
      - name: Frontend format, lint, tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Initialize private CI environment
        run: python3 scripts/init-env.py
      - name: Fresh MySQL build and startup
        run: |
          docker compose -p leaguedesk-ci config --quiet
          docker compose -p leaguedesk-ci up -d --build --wait --wait-timeout 180
      - name: Real MySQL workflow and permissions
        run: |
          curl --fail http://127.0.0.1:8144/actuator/health
          python3 scripts/quality.py
          docker compose -p leaguedesk-ci restart backend
          docker compose -p leaguedesk-ci up -d --wait --wait-timeout 180
          python3 scripts/verify-persistence.py
      - name: Database backup and isolated restore
        run: |
          python3 scripts/backup.py --project leaguedesk-ci --output /tmp/leaguedesk-ci.zip
          python3 -c "from pathlib import Path;p=Path('.env');Path('/tmp/leaguedesk-restore.env').write_text(p.read_text().replace('WEB_PORT=8144','WEB_PORT=8145'))"
          python3 scripts/restore.py /tmp/leaguedesk-ci.zip --project leaguedesk-ci-restore --env-file /tmp/leaguedesk-restore.env
          python3 scripts/verify-persistence.py --base http://127.0.0.1:8145 --env-file /tmp/leaguedesk-restore.env
      - name: Release assets and source checks
        run: python3 scripts/release-check.py
      - name: Cleanup this run only
        if: always()
        run: |
          docker compose -p leaguedesk-ci down -v
          if [ -f /tmp/leaguedesk-restore.env ]; then docker compose --env-file /tmp/leaguedesk-restore.env -p leaguedesk-ci-restore down -v; fi
          rm -f /tmp/leaguedesk-ci.zip /tmp/leaguedesk-restore.env
